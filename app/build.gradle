plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexvary.trafficlab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexvary.trafficlab'
        minSdk 26
        targetSdk 35
        versionCode 103
        versionName '10.0.3-build-fix-lab'
        buildConfigField 'String', 'RECOVERY_ENDPOINT', '"' + (project.findProperty('nexvaryRecoveryEndpoint') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
